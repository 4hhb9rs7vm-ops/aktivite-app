<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Şu An'ı indir</title>
<meta name="description" content="Şu an dünyada kim ne yapıyor? Şu An'ı indir, seninle aynı şeyi yapanların oranını gör.">
<meta property="og:title" content="Şu An: Kim Ne Yapıyor?">
<meta property="og:description" content="Şu an seninle aynı şeyi yapan kaç kişi var? Hemen öğren.">
<style>
  :root { --navy:#0F2A52; --accent:#A5B4FC; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--navy); color:#fff;
         font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; text-align:center; padding:24px; }
  .wrap { max-width:420px; width:100%; }
  h1 { font-size:30px; line-height:1.2; margin:0 0 10px; }
  h1 span { color:var(--accent); }
  p { color:#C9D3EE; font-size:16px; line-height:1.5; margin:0 0 28px; }
  .btn { display:block; width:100%; padding:16px; margin:0 0 12px; border-radius:16px; font-size:17px; font-weight:700; text-decoration:none; }
  .ios { background:#fff; color:var(--navy); }
  .android { background:rgba(255,255,255,0.12); color:#fff; border:1px solid rgba(255,255,255,0.25); }
  small { display:block; margin-top:20px; color:#8FA3D1; font-size:13px; }
  small a { color:#C9D3EE; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Şu an <span>sen</span><br>ne yapıyorsun?</h1>
  <p>Şu An'ı indir, seninle aynı şeyi yapanların oranını gör.</p>
  <a class="btn ios" href="https://apps.apple.com/app/id6817275887">App Store'dan indir</a>
  <a class="btn android" href="https://play.google.com/store/apps/details?id=com.tvfk.aktiviteapp">Google Play'den indir</a>
  <small><a href="../gizlilik/">Gizlilik Politikası</a> · <a href="../kullanim-sartlari/">Kullanım Şartları</a></small>
</div>
<script>
  // Telefonu tanı ve doğru mağazaya yönlendir; bilgisayarda iki buton görünür
  (function () {
    var ua = navigator.userAgent || '';
    var isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    var isAndroid = /Android/i.test(ua);
    if (isIOS) location.replace('https://apps.apple.com/app/id6817275887');
    else if (isAndroid) location.replace('https://play.google.com/store/apps/details?id=com.tvfk.aktiviteapp');
  })();
</script>
</body>
</html>
